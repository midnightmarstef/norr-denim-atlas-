name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unlock (or create) the NORR signing key
        id: key
        env:
          NORR_SIGNING_PASSPHRASE: ${{ secrets.NORR_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$NORR_SIGNING_PASSPHRASE" ]; then
            echo "::warning::No NORR_SIGNING_PASSPHRASE secret yet. Add it under Settings > Secrets and variables > Actions, then run this workflow again. Skipping the build so the current APK stays in place."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/norr.p12"
          if [ -f signing/norr-release.p12.enc ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/norr-release.p12.enc -out "$KS" -pass env:NORR_SIGNING_PASSPHRASE; then
              echo "::error::NORR_SIGNING_PASSPHRASE does not unlock signing/norr-release.p12.enc. Put the original passphrase back in the secret."
              exit 1
            fi
          else
            # First run: make the app's permanent key here, lock it with the secret, and store only the locked copy.
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias norr -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass:env NORR_SIGNING_PASSPHRASE -keypass:env NORR_SIGNING_PASSPHRASE -dname "CN=NORR Atlas, O=NORR, C=IS"
            mkdir -p signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out signing/norr-release.p12.enc -pass env:NORR_SIGNING_PASSPHRASE
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/norr-release.p12.enc
            git commit -m "Store the encrypted NORR signing key"
            git push
          fi
          echo "NORR_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@v3
        if: steps.key.outputs.ready == 'true'
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.ready == 'true'
        with:
          gradle-version: "8.9"

      - name: Build signed APK
        if: steps.key.outputs.ready == 'true'
        env:
          NORR_SIGNING_PASSPHRASE: ${{ secrets.NORR_SIGNING_PASSPHRASE }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk norr-atlas.apk
          VC=$((100 + GITHUB_RUN_NUMBER))
          printf '{"versionCode": %d, "versionName": "1.%d", "apk": "https://github.com/%s/releases/latest/download/norr-atlas.apk"}\n' "$VC" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: norr-atlas-apk
          path: |
            norr-atlas.apk
            version.json

      - name: Publish as the latest release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest norr-atlas.apk version.json \
            --title "NORR Atlas 1.${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open norr-atlas.apk on your Android phone to install or update."
